name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Linux checks
        run: bash .github/ci/linux.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Windows checks (pwsh 7)
        shell: pwsh
        run: pwsh -NoProfile -File .github/ci/windows.ps1
      - name: Windows checks (5.1)
        shell: pwsh
        run: '& "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -File .github/ci/windows.ps1'